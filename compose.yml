name: suwairo

services:
    server:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        environment:
            TZ: ${TZ:-Etc/UTC}
        ports:
            - "${SUWAIRO_PORT:-4567}:4567"
        volumes:
            - suwairo-data:/data
        healthcheck:
            test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4567/ || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 30s

volumes:
    suwairo-data:
